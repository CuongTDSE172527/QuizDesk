name: Windows EXE release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag matching source version; leave blank to use the version in source'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: ./.github/scripts/Get-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG
      - name: Pin SDK resolver
        run: |
          '{"sdk":{"version":"10.0.402","rollForward":"disable","allowPrerelease":false}}' | Set-Content -LiteralPath global.json -Encoding utf8
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Test publishing safety (no GitHub writes)
        run: ./.github/scripts/Test-ReleasePublishing.ps1
      - name: Run core regression checks
        run: ./.github/scripts/Test-Release.ps1
      - name: Publish and package Windows app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./.github/scripts/Build-WindowsInstaller.ps1 -Version $env:RELEASE_VERSION
      - name: Save installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ github.run_id }}
          path: dist/release-windows/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish EXE to GitHub Releases
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: quizdesk-release-publish-${{ needs.build.outputs.tag }}-windows-${{ needs.build.outputs.commit }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Download verified installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-${{ github.run_id }}
          path: dist/release-windows
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          AUTOMATIC_PUSH: ${{ github.event_name == 'push' }}
        run: ./.github/scripts/Publish-Release.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -Platform windows -Directory dist/release-windows -Automatic:($env:AUTOMATIC_PUSH -eq 'true')
