name: iOS Simulator build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'QuizDesk.Core/**'
      - 'QuizDesk.Mobile/**'
      - 'QuizDesk.iOS/**'
      - 'build-ios.sh'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .NET iOS Simulator
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.6.app || { echo '::error::Xcode 26.6 is missing from this runner image.'; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Install matching iOS workload
        run: |
          dotnet workload install ios --version 10.0.401
          dotnet --info
          dotnet workload --info
      - name: Build Simulator app (no Apple signing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sh build-ios.sh simulator 2>&1 | tee artifacts/ios-build.log
      - name: Package Simulator app
        shell: bash
        run: |
          set -euo pipefail
          app=$(find QuizDesk.iOS/bin/Debug/net10.0-ios -maxdepth 2 -type d -name 'QuizDesk.iOS.app' -print -quit)
          test -n "$app" || { echo '::error::Simulator .app was not produced.'; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/QuizDesk-iOS-Simulator.zip
      - name: Upload app and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuizDesk-iOS-Simulator-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
