name: iOS build (Simulator and iPhone IPA)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag matching source version; leave blank to use source version'
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build .NET iOS Simulator
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.6.app || { echo '::error::Xcode 26.6 is missing from this runner image.'; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Pin SDK resolver
        shell: bash
        run: |
          printf '%s\n' '{"sdk":{"version":"10.0.402","rollForward":"disable","allowPrerelease":false}}' > global.json
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Install matching iOS workload
        run: |
          dotnet workload install ios --version 10.0.401
          dotnet --info
          dotnet workload --info
      - name: Build Simulator app (no Apple signing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sh build-ios.sh simulator 2>&1 | tee artifacts/ios-build.log
      - name: Package Simulator app
        shell: bash
        run: |
          set -euo pipefail
          app=$(find QuizDesk.iOS/bin/Debug/net10.0-ios -maxdepth 2 -type d -name 'QuizDesk.iOS.app' -print -quit)
          test -n "$app" || { echo '::error::Simulator .app was not produced.'; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/QuizDesk-iOS-Simulator.zip
      - name: Upload app and build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QuizDesk-iOS-Simulator-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  unsigned-ipa:
    name: Build unsigned IPA for iPhone
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: ./.github/scripts/Get-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG
      - name: Test release publishing safety (no GitHub writes)
        shell: pwsh
        run: ./.github/scripts/Test-ReleasePublishing.ps1
      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.6.app || { echo '::error::Xcode 26.6 is missing from this runner image.'; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Pin SDK resolver
        shell: bash
        run: |
          printf '%s\n' '{"sdk":{"version":"10.0.402","rollForward":"disable","allowPrerelease":false}}' > global.json
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Install matching iOS workload
        run: |
          dotnet workload install ios --version 10.0.401
          dotnet --info
          dotnet workload --info
      - name: Build device IPA without Apple credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sh build-ios.sh unsigned 2>&1 | tee artifacts/ios-device-build.log
      - name: Prepare versioned IPA and checksum for Releases
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference='Stop'
          $source='dist/ios/QuizDesk-ios-arm64-unsigned.ipa'
          $hash=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $originalChecksum=([IO.File]::ReadAllText("$source.sha256").Trim() -split '\s+')[0]
          if($hash -cne $originalChecksum){throw 'Built IPA does not match its original checksum.'}
          New-Item -ItemType Directory -Path dist/release-ios -Force | Out-Null
          $name="QuizDesk-$env:RELEASE_VERSION-ios-arm64-unsigned.ipa"
          Copy-Item -LiteralPath $source -Destination "dist/release-ios/$name"
          "$hash  $name" | Set-Content -LiteralPath "dist/release-ios/QuizDesk-$env:RELEASE_VERSION-iOS-unsigned-SHA256.txt" -Encoding ascii
      - name: Save versioned IPA release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ios-unsigned-${{ github.run_id }}
          path: dist/release-ios/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QuizDesk-iPhone-unsigned-IPA-${{ github.run_number }}
          path: |
            dist/ios/QuizDesk-ios-arm64-unsigned.ipa
            dist/ios/QuizDesk-ios-arm64-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload device build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QuizDesk-iPhone-build-log-${{ github.run_number }}
          path: artifacts/ios-device-build.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish unsigned IPA to GitHub Releases
    needs: unsigned-ipa
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: quizdesk-release-publish-${{ needs.unsigned-ipa.outputs.tag }}-ios-unsigned-${{ needs.unsigned-ipa.outputs.commit }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.unsigned-ipa.outputs.commit }}
          persist-credentials: false
      - name: Download versioned IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ios-unsigned-${{ github.run_id }}
          path: dist/release-ios
      - name: Publish IPA and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.unsigned-ipa.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.unsigned-ipa.outputs.commit }}
          AUTOMATIC_PUSH: ${{ github.event_name == 'push' }}
        run: ./.github/scripts/Publish-Release.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -Platform ios-unsigned -Directory dist/release-ios -Automatic:($env:AUTOMATIC_PUSH -eq 'true')
      - name: Explain IPA signing status
        run: '"This IPA is unsigned and must be signed before installation on an iPhone. It is not a TestFlight/App Store build." | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8'
